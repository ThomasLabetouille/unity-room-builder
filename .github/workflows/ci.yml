name: CI

on:
  push:
  pull_request:

jobs:
  geometrie:
    name: Proprietes geometriques, hors Unity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet run -c Release --project Tools/GeometryTests/GeometryTests.csproj
